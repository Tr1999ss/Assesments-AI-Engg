[project]
name = "ragapp"
version = "0.1.0"
description = "Local RAG CLI — Ask My Docs"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.6.3",
    "ollama==0.3.3",
    "typer>=0.12",
]

[project.scripts]
ragapp = "ragapp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragapp"]
